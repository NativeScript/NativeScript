# Type-checks packages/core under strictNullChecks against the per-file error
# baseline in packages/core/strict-baseline.json, so the error count can only
# go down.
name: 'Core strict type-check'
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23.5.0
          cache: 'npm'
      - name: 'Install dependencies'
        run: npm ci
      - name: 'Check strictNullChecks baseline'
        run: npx nx run core:typecheck-strict
