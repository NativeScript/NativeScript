name: Compiler

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'packages/compiler/**'
      - 'packages/core/**'
      - 'packages/types-ios/**'
      - 'tools/native-kit/**'
      - '.github/workflows/compiler.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Generate NativeScriptKit from core
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds core, then compiles its TypeScript into the kit's Swift (packages/compiler/kit-apple/Sources/NativeScriptKit/Core).
      - name: Generate the kit
        run: npx nx run compiler:kit

      - name: Upload the generated kit
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kit-core
          path: packages/compiler/kit-apple/Sources/NativeScriptKit/Core
          if-no-files-found: error

      - name: Upload the built core
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: core-dist
          path: dist/packages/core
          if-no-files-found: error

  ios:
    name: Differential tests and the kit's build (iOS)
    needs: kit
    runs-on: warp-macos-15-arm64-6x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Download the generated kit
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kit-core
          path: packages/compiler/kit-apple/Sources/NativeScriptKit/Core

      - name: Download the built core
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: core-dist
          path: dist/packages/core

      - name: Install the compiler's dependencies
        working-directory: packages/compiler
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix tests --no-audit --no-fund

      # Each case runs under Node and as compiled Swift; their output must match.
      - name: Differential tests (Swift)
        working-directory: packages/compiler
        run: node tests/diff/run.ts --swift

      # The kit builds only inside an app's project, beside core's native code (TNSWidgets, NativeScriptUtils…): a fixture app,
      # with every file of the kit compiled. The generated kit uses the newest iOS APIs behind availability checks, so this needs the newest Xcode.
      - name: Build the kit
        run: |
          xcodebuild -version
          packages/compiler/tests/kit-build.sh dist/packages/core
